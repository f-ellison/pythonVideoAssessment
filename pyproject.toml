[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-aspect-matching-api"
version = "1.0.0"
description = "A headless, in-memory FastAPI app to detect aspect ratios and match cross-platform duplicate video content."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Frank Ellison", email = "frankdellison@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Video :: Conversion",
]

# Replaces requirements.txt for modern dependency lock trackers
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8.0",
    "imagehash>=4.3",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short"
testpaths = [
    "test_main.py",
]
