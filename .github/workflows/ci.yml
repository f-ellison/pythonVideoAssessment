name: Python Project CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out source code repository branch layers
      uses: actions/checkout@v4

    - name: Set up runtime Python environment sandbox
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent build executions

    - name: Install system multimedia dependencies for OpenCV headless processing
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-0

    # UPDATED: Installs dependencies directly from pyproject.toml
    - name: Build engine dependencies via pyproject config matrix
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    # UPDATED: Pytest now reads configurations automatically from pyproject.toml
    - name: Execute Pytest test suites
      run: |
        pytest

    - name: Trigger Automated Deployment to Render Instance
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "🚀 Requesting production deployment pull from Render..."
        curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK }}"
